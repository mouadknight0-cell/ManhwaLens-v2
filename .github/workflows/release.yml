name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ''
      VERSION_CODE: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="1.0.0-snapshot"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building ManhwaLens $VERSION_NAME (code ${{ github.run_number }})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          MANHWALENS_KEYSTORE_BASE64: ${{ secrets.MANHWALENS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MANHWALENS_KEYSTORE_BASE64" ]; then
            echo "$MANHWALENS_KEYSTORE_BASE64" | base64 -d > /tmp/manhwalens-release.p12
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded — APK will be signed with the stable key."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MANHWALENS_KEYSTORE_BASE64 secret not set — the release APK will be signed with the ephemeral debug key. Updates over an existing install will require uninstalling first until the stable key secret is configured."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        env:
          VERSION_NAME: ${{ steps.meta.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.meta.outputs.VERSION_CODE }}

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          VERSION_NAME: ${{ steps.meta.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.meta.outputs.VERSION_CODE }}
          MANHWALENS_KEYSTORE_FILE: /tmp/manhwalens-release.p12
          MANHWALENS_KEYSTORE_PASSWORD: ${{ secrets.MANHWALENS_KEYSTORE_PASSWORD }}
          MANHWALENS_KEY_ALIAS: ${{ secrets.MANHWALENS_KEY_ALIAS }}
          MANHWALENS_KEY_PASSWORD: ${{ secrets.MANHWALENS_KEY_PASSWORD }}

      - name: Assemble debug APK (installable fallback)
        run: ./gradlew assembleDebug --stacktrace
        env:
          VERSION_NAME: ${{ steps.meta.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.meta.outputs.VERSION_CODE }}

      - name: Verify APK outputs
        run: |
          ls -la app/build/outputs/apk/release/ || true
          ls -la app/build/outputs/apk/debug/ || true

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/manhwalens-release.p12

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          name: ManhwaLens ${{ steps.meta.outputs.VERSION_NAME }}
          body: |
            ## ManhwaLens ${{ steps.meta.outputs.VERSION_NAME }}

            Native Android app for iPhone-free manhwa reading: captures the screen via MediaProjection, reads the English dialogue on-device (ML Kit OCR), and renders it in natural Arabic — with a floating bubble overlay. Fully offline after one-time model downloads.

            ### Install
            Download **`app-release.apk`** below and open it on your phone. If prompted, allow installation from unknown sources.
             > Until the `MANHWALENS_KEYSTORE_*` secrets are configured, the release APK is debug-signed; uninstall any older ManhwaLens before installing.
            `app-debug.apk` is a debug build suitable for testing.

            ### Highlights (v1.1.0)
            - **Capture session rebuilt**: the pipeline now lives for the whole session (no per-capture VirtualDisplay race) — fresh frames with a newest-frame fallback
            - **English → Arabic only** (locked scope), sentence reconstruction before translation, dialogue/narration/SFX classification
            - **CN/KR character names** in romanized English are detected, never translated, and remembered permanently
            - **Structured diagnostics** (content-free JSONL logs, per-journey trace id, consistent error codes) + **T0–T12 benchmark** system (first visible Arabic sentence / full screen), exportable from Settings → Diagnostics
            - Progressive per-block translation reveal · Arabic RTL rendering · on-device history
            - Package id: `com.manhwalens.app`

            ### Honest disclosure
            - Builds run on GitHub Actions; the capture fix is verified by build + unit tests only and **has not yet been validated on a physical device**. See issue #7 for the device checklist (required before claiming v1.1.0 reliability).
            - KO/ZH sources are deferred until the EN→AR pipeline is device-proven.
            - Translation quality is bounded by the on-device ML Kit model (not an LLM).
          generate_release_notes: true
          fail_on_unmatched_files: false
