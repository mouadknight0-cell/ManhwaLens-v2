name: Official release candidate

# Builds a SIGNED RELEASE APK for physical-device testing.
# Never runs assembleDebug, never publishes a GitHub release, never touches the next
# release's version number, and never falls back to debug signing.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Candidate versionName (must end with -rc, e.g. 1.1.42-rc4)
        required: true
        default: 1.1.42-rc4
      installed_version_code:
        description: versionCode currently installed on the test phone; the candidate is computed strictly above it
        required: true
        default: '217442876'
      min_installed_version_code:
        description: Hard floor the candidate must clear (fail closed if lower); usually the newest official release
        required: true
        default: '217442876'
  push:
    branches: [arena/f6ce5fe4-manhwalens-v2]
    paths:
      - '.github/workflows/release-candidate.yml'
      - '.github/scripts/**'
      - '.github/tests/**'
      - 'signing/**'
      - 'app/build.gradle.kts'
      # Application code changes must rebuild the candidate (the dispatch below is the
      # authoritative trigger; this keeps an accidental push from being silently skipped).
      - 'app/src/main/**'

permissions:
  # Read the repo, and create/update the PRERELEASE that carries the APK so the owner can
  # download the .apk file directly instead of a workflow artefact zip.
  contents: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_NAME: ${{ inputs.version_name || '1.1.42-rc4' }}
  # The candidate must be installable *over* what is already on the phone, so the floor is
  # supplied explicitly instead of guessed from the repository's latest release.
  INSTALLED_VERSION_CODE: ${{ inputs.installed_version_code || '217442875' }}
  # Explicit hard floor: the candidate must be installable over the newest official release
  # even when nothing is installed on the test phone. Fail closed if it cannot be met.
  MIN_INSTALLED_VERSION_CODE: ${{ inputs.min_installed_version_code || '217442875' }}
  # Makes the Gradle release task refuse an unsigned output path, even if someone sets
  # ALLOW_UNSIGNED_RELEASE in this job by mistake.
  CANDIDATE_RELEASE_BUILD: 'true'

jobs:
  release-candidate:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `env.VERSION_NAME` (the resolved candidate name, workflow-level) is the single source of
    # truth for the artefact name, the prerelease tag and the download check. Reading
    # `inputs.*` in these steps silently fell back to a stale default on push-triggered runs
    # and published a tag for a file that did not exist.
    steps:
      - name: Checkout the exact commit under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Signing recovery regression tests
        run: |
          python3 -m pip install cryptography
          python3 -m unittest discover -s .github/tests -t .github/tests -v

      - name: Resolve version identity before building
        id: version
        shell: bash
        run: |
          set -euo pipefail
          case "$VERSION_NAME" in
            *-rc*) ;;
            *) echo '::error::A candidate build needs an -rc versionName'; exit 1;;
          esac
          echo "Commit under test: $(git rev-parse HEAD)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          # Per-commit code, identical to release.yml.
          code=$(( $(git show -s --format=%ct HEAD) - 1577836800 ))
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          # Build identity for on-device evaluation runs. Full SHA, never abbreviated,
          # and never optional: an evaluation run recorded as `unknown` cannot be tied
          # to the code that produced its translations, which is the whole point of
          # recording a revision.
          revision=$(git rev-parse HEAD)
          if ! printf '%s' "$revision" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::could not read a full 40-hex commit SHA (got '$revision')"
            exit 1
          fi
          echo "GIT_REVISION=$revision" >> "$GITHUB_ENV"
          echo "git_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          # Monotonic floor: the newest published GitHub release must be strictly below us.
          # --exclude-pre-releases matters: without it a later candidate run reads its
          # own earlier prerelease tag as "the newest official release", so the floor
          # is computed against the wrong base and the reported last_release is false.
          last=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' || true)
          if [ -z "$last" ]; then echo '::error::no published release found; refusing to guess a version floor'; exit 1; fi
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$last" -q .object.sha)
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$last" -q .object.type)
          if [ "$type" = tag ]; then tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" -q .object.sha); fi
          last_epoch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_sha" -q '.commit.committer.date')
          last_code=$(python3 -c "import datetime,sys;print(int(datetime.datetime.fromisoformat('$last_epoch'.replace('Z','+00:00')).timestamp())-1577836800)")
          # The floor arithmetic lives in a unit-tested helper (.github/tests) because an
          # un-installable or non-monotonic candidate is not recoverable after publication.
          # It fails closed on a missing/malformed floor rather than guessing one.
          python3 .github/scripts/candidate_version_code.py \
            --last-release-code "$last_code" \
            --installed-version-code "${INSTALLED_VERSION_CODE:-}" \
            --min-installed-version-code "${MIN_INSTALLED_VERSION_CODE:-}" \
            --commit-epoch "$(git show -s --format=%ct HEAD)" > /tmp/candidate.env
          cat /tmp/candidate.env
          # shellcheck disable=SC1091
          . /tmp/candidate.env
          echo "last_release=$last last_version_code=$last_code installed_version_code=$installed min_installed_version_code=$min_installed candidate=$candidate floor=$floor"
          echo "expected_version_code=$candidate" >> "$GITHUB_OUTPUT"
          echo "installed_version_code=$installed" >> "$GITHUB_OUTPUT"
          echo "min_installed_version_code=$min_installed" >> "$GITHUB_OUTPUT"
          echo "last_version_code=$last_code" >> "$GITHUB_OUTPUT"
          echo "last_release=$last" >> "$GITHUB_OUTPUT"
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "::notice title=Candidate versionCode::$candidate (floor $floor + 1; last release $last_code, installed $installed, min installed $min_installed)"
          # Hold the candidate at the computed floor instead of the per-commit release code, so
          # a test build never burns the number the eventual tagged release needs.
          echo "CANDIDATE_VERSION_CODE_HOLD=$floor" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode the pinned release keystore from the versioned vault
        # Runs before any release task: every *release* Gradle task requires the pinned key
        # (preReleaseBuild), so an unsigned or debug-signed release cannot be produced even
        # by accident. The vault is the durable key backup and the password is an
        # independent Actions secret; plaintext exists only inside this runner and is
        # deleted at job end. The helper fails closed on any fingerprint mismatch.
        env:
          # Individually scoped, exactly like sign-release.yml: the vault passphrase is
          # only visible to this step, never to the whole job.
          SIGNING_BACKUP_PASSWORD: ${{ secrets.SIGNING_BACKUP_PASSWORD }}
        run: |
          python3 -m pip install cryptography
          python3 .github/scripts/decode_release_keystore.py

      - name: Verify the release signer matches the pinned production certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$MANHWALENS_KEYSTORE_FILE" -storetype PKCS12 \
            -alias manhwalens -storepass:env MANHWALENS_KEYSTORE_PASSWORD \
            | tee /tmp/keytool.txt
          actual=$(grep -m1 'SHA256:' /tmp/keytool.txt | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          pinned=$(tr -d ' \n' < signing/release-cert.sha256 | tr 'A-F' 'a-f')
          echo "keystore_certificate_sha256=$actual"
          echo "pinned_certificate_sha256=$pinned"
          if [ "$actual" != "$pinned" ]; then
            echo '::error::The decoded keystore does not match the pinned production certificate. Refusing to build.'
            exit 1
          fi

      - name: Release Kotlin compilation
        run: ./gradlew :app:compileReleaseKotlin --stacktrace --no-daemon

      - name: Release unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace --no-daemon

      - name: Summarise the release unit test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          files = sorted(glob.glob('app/build/test-results/testReleaseUnitTest/TEST-*.xml'))
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          print(f"::notice title=Release unit tests::suites={len(files)} tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if tests == 0 or failures or errors:
              raise SystemExit('release unit tests did not pass cleanly')
          PY

      - name: Instrumented test source compilation
        run: ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace --no-daemon

      - name: Assemble signed RELEASE APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MANHWALENS_KEYSTORE_FILE:-}" ]; then
            echo '::error::No release keystore in this job; refusing an unsigned or debug-signed build.'
            exit 1
          fi
          ./gradlew assembleRelease --stacktrace --no-daemon
          ls -l app/build/outputs/apk/release/

      - name: Verify signature, certificate, identity and versionCode
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo '::error::assembleRelease produced no app-release.apk (unsigned output is not a release)'; exit 1; }
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build_tools=$build_tools"
          mkdir -p artifacts
          python3 .github/scripts/verify_release_apk.py \
            --apk "$apk" \
            --apk-id "$build_tools/aapt" \
            --apksigner "$build_tools/apksigner" \
            --expected-version-name "$VERSION_NAME" \
            --expected-version-code "${{ steps.version.outputs.expected_version_code }}" \
            --min-version-code "${{ steps.version.outputs.floor }}" \
            --git-revision "${{ steps.version.outputs.git_revision }}" \
            --require-git-revision \
            | tee artifacts/APK-IDENTITY.txt
          # The pinned fingerprint must be published next to the APK for the owner to compare
          # against the installed official application before claiming update compatibility.
          cp signing/release-cert.sha256 artifacts/release-cert.sha256
          cp "$apk" artifacts/ManhwaLens-$VERSION_NAME-release.apk
          (cd artifacts && sha256sum ManhwaLens-$VERSION_NAME-release.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "## Official release candidate $VERSION_NAME"
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- artifact: \`ManhwaLens-$VERSION_NAME-release.apk\` (signed RELEASE build)"
            echo "- pinned last release: ${{ steps.version.outputs.last_release }} (versionCode ${{ steps.version.outputs.last_version_code }})"
            cat artifacts/APK-IDENTITY.txt
          } > artifacts/BUILD-INFO.md
          cat artifacts/BUILD-INFO.md

      - name: Fail if the APK does not carry this commit as its build identity
        # The app records GIT_REVISION into every evaluation run. If the field did
        # not receive this commit, every run from this APK would claim an identity it
        # does not have -- so the mismatch is a build failure, not a warning.
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          actual=$(grep -E '^git_revision=' artifacts/APK-IDENTITY.txt | cut -d= -f2 || true)
          recorded=$(grep -E '^git_revision=' artifacts/BUILD-INFO.md | cut -d= -f2 || true)
          echo "expected=$expected identity=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK build identity '$actual' does not match the commit under test '$expected'"
            exit 1
          fi
          printf '%s' "$actual" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::build identity is not a full 40-hex SHA: '$actual'"
            exit 1
          }

      - name: Fail if the release APK was debug-signed
        if: always() && steps.verify.outcome == 'success'
        run: |
          # Defence in depth: a debug certificate can never satisfy the pinned fingerprint,
          # but make the intent explicit and loud in the log.
          pinned=$(tr -d ' \n' < signing/release-cert.sha256 | tr 'A-F' 'a-f')
          grep -q "signer_certificate_sha256=$pinned" artifacts/APK-IDENTITY.txt

      - name: Publish the build identity in the run annotations
        # Hashes only: the certificate fingerprint and the APK digest must be readable
        # without downloading the 60 MB artefact (and without any secret in the log).
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice title=Release candidate identity::$line"
          done < artifacts/APK-IDENTITY.txt
          echo "::notice title=Release candidate identity::legacy_certificate_sha256=$(tr -d ' \n' < signing/legacy-release-cert.sha256)"
          echo "::notice title=Release candidate identity::commit_under_test=$(git rev-parse HEAD)"
          echo "::notice title=Release candidate identity::r8_minify=disabled (isMinifyEnabled=false, isShrinkResources=false)"

      - name: Upload the signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ManhwaLens-${{ env.VERSION_NAME }}-release-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish the APK as a direct download (prerelease, never latest)
        # A workflow artefact is only ever delivered as a zip. The owner needs the .apk
        # itself, so the same verified file is attached to a PRERELEASE whose tag is
        # derived from the candidate version. Prereleases are skipped by the published-
        # release lookup above and can never become "Latest", so nothing is published.
        id: direct
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rc-${{ env.VERSION_NAME }}
        run: |
          set -euo pipefail
          apk="artifacts/ManhwaLens-${{ env.VERSION_NAME }}-release.apk"
          sha=$(awk '{print $1}' artifacts/SHA256SUMS.txt)
          notes="Official signed RELEASE build for physical-device testing. Not a published release.

          - commit: \`$(git rev-parse HEAD)\`
          - APK SHA-256: \`$sha\`
          - signer certificate SHA-256: \`$(tr -d ' \n' < signing/release-cert.sha256)\`
          - versionName/versionCode: see APK-IDENTITY.txt

          $(cat artifacts/APK-IDENTITY.txt)"
          # Create on first run, refresh afterwards; assets are replaced (--clobber) so the
          # download URL stays stable across reruns of the same candidate version.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --prerelease --title "Release candidate ${TAG#rc-}" --notes "$notes"
          gh release edit "$TAG" --prerelease --notes "$notes" >/dev/null
          gh release upload "$TAG" "$apk" artifacts/APK-IDENTITY.txt artifacts/SHA256SUMS.txt artifacts/release-cert.sha256 --clobber
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$apk")"
          echo "direct_apk_url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Direct APK download::${url}"

      - name: Verify the direct download really serves the tested APK
        # The whole point is a link that hands over the .apk, so check the published asset
        # name, its size and its extension against the file this job verified.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rc-${{ env.VERSION_NAME }}
          APK: artifacts/ManhwaLens-${{ env.VERSION_NAME }}-release.apk
        run: |
          set -euo pipefail
          name=$(basename "$APK")
          test "${name##*.}" = apk || { echo '::error::the published asset is not an .apk file'; exit 1; }
          listed=$(gh release view "$TAG" --json assets -q '.assets[] | select(.name=="'"$name"'") | "\(.name)\t\(.size)"')
          test -n "$listed" || { echo "::error::the release does not carry $name"; exit 1; }
          remote_size=${listed##*$'\t'}
          local_size=$(stat -c %s "$APK")
          echo "asset=$name remote_size=$remote_size local_size=$local_size"
          test "$remote_size" = "$local_size" || { echo '::error::published asset size differs from the verified APK'; exit 1; }
          # Size alone cannot prove the bytes are the ones that were signed. Download the
          # published asset through the API (a redirect there would yield an empty file and a
          # hash mismatch, which is the safe way to fail) and compare the digest.
          local_sha=$(awk '{print $1}' artifacts/SHA256SUMS.txt)
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q ".assets[] | select(.name==\"$name\") | .id")
          remote_sha=$(curl -sSfL -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" | sha256sum | awk '{print $1}')
          echo "asset=$name local_sha256=$local_sha remote_sha256=$remote_sha"
          test "$remote_sha" = "$local_sha" || { echo '::error::the published APK does not hash to the verified APK'; exit 1; }
          echo "::notice title=Direct APK download verified::$name ($local_size bytes) sha256=$remote_sha at ${{ steps.direct.outputs.direct_apk_url }}"

      - name: Release test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-test-evidence
          path: |
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove the decoded keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" || true
