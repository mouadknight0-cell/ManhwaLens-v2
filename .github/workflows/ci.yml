name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify Gradle boots (configuration smoke test)
        run: ./gradlew help --stacktrace --no-daemon

      - name: Resolve dependency graph
        run: ./gradlew :app:dependencies --configuration debugUnitTestCompileClasspath --no-daemon > /tmp/deps.txt 2>&1 || (cat /tmp/deps.txt && exit 1)

      - name: Compile app sources
        shell: bash
        run: ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon 2>&1 | tee /tmp/compile.log

      - name: Annotate compiler errors
        if: failure()
        shell: bash
        run: |
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | cut -c1-450; }
          echo "::error::LAST LINES: $(tail -8 /tmp/compile.log | esc | tr '\n' '|')"
          grep -inE 'error|exception|what went wrong|failed' /tmp/compile.log | tail -25 | while IFS= read -r line; do
            echo "::error::${line}" | esc
          done
          exit 1

      - name: Compile test sources
        run: ./gradlew :app:compileDebugUnitTestKotlin --stacktrace --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manhwalens-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
