name: Sign verified release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unsigned draft tag (used for sign operation)
        required: true
        default: v1.1.19
      operation:
        description: Initialize only once, then sign for all subsequent releases
        type: choice
        options: [sign, initialize]
        default: sign
      backup_confirmed:
        description: For initialize ONLY - I saved SIGNING_BACKUP_PASSWORD privately and accept incompatibility with v1.1.6
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: stable-release-signing
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m pip install cryptography
      - name: Validate initialization authorization and backup acknowledgement
        if: inputs.operation == 'initialize'
        env:
          CONFIRMED: ${{ inputs.backup_confirmed }}
        run: |
          test "$CONFIRMED" = true || { echo '::error::Save the backup password privately and acknowledge the incompatible signing reset first.'; exit 1; }
          test "$GITHUB_REF_TYPE" = branch || { echo '::error::Initialize on the current working branch, not a tag.'; exit 1; }
      - name: Generate and verify encrypted recovery vault (never replace existing key)
        if: inputs.operation == 'initialize'
        env:
          SIGNING_BACKUP_PASSWORD: ${{ secrets.SIGNING_BACKUP_PASSWORD }}
        run: python3 .github/scripts/signing_vault.py
      - name: Persist encrypted vault and public pin on the same branch
        if: inputs.operation == 'initialize'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signing/release-key.enc.json signing/release-cert.sha256 signing/legacy-release-cert.sha256
          git commit -m 'security: persist encrypted release signer and pin its public certificate'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'Encrypted recovery material is now versioned. Keep a separate backup of the vault and its password.'
      - name: Sign only with durable vault and verify pinned identity
        if: inputs.operation != 'initialize'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SIGNING_BACKUP_PASSWORD: ${{ secrets.SIGNING_BACKUP_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/sign_release.py 2>&1 | tee /tmp/signing.log
      - name: Surface signing failure
        if: failure() && inputs.operation != 'initialize'
        run: |
          if test -f /tmp/signing.log; then
            tail -25 /tmp/signing.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error::$line"
            done
          fi
