name: Publish Phase 3.1 phone test
on:
  push:
    branches: [arena/f6ce5fe4-manhwalens-v2]
    paths: ['.github/workflows/phase31-phone.yml', 'app/src/test/java/com/manhwalens/app/translate/ReliabilityTest.kt']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Wait for both gates, then copy the tested APK without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for gate in ci quality; do
            while :; do
              run=$(gh api "repos/$GH_REPO/actions/workflows/$gate.yml/runs?head_sha=$GITHUB_SHA&per_page=1" --jq '.workflow_runs[0] | [.id,.status,.conclusion] | @tsv')
              read -r id status conclusion <<< "$run"
              if [[ $status == completed ]]; then [[ $conclusion == success ]]; break; fi
              sleep 20
            done
            if [[ $gate == ci ]]; then ci=$id; fi
          done
          id=$(gh api "repos/$GH_REPO/actions/runs/$ci/artifacts" --jq '.artifacts[]| select(.name=="manhwalens-debug-apk") | .id')
          gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > artifact.zip
          unzip -p artifact.zip app-debug.apk > ManhwaLens-phase3.1.apk
          unzip -tq ManhwaLens-phase3.1.apk
          gh release create "test-phase31-${GITHUB_SHA:0:7}" ManhwaLens-phase3.1.apk --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --latest=false --title 'Phase 3.1 · phone reliability test' --notes "CI run $ci. Single test APK; not a stable release."
