name: Android quality regression
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [arena/ae360a1c-manhwalens-v2, arena/f6ce5fe4-manhwalens-v2]
    paths:
      - '.github/workflows/quality.yml'
      - '.github/scripts/android-quality.sh'
      - 'app/src/**'
      - 'app/build.gradle.kts'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 14 real-image OCR and circular view tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-quality.sh
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-results
          path: |
            app/build/reports/androidTests/
            app/build/reports/overlay-evidence/
            app/build/outputs/androidTest-results/
      - name: Surface test failures
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -name '*.xml' -exec grep -H -B 2 -A 14 '<failure' {} \; | head -50 | while IFS= read -r line; do
            echo "::error::${line//'%'/'%25'}"
          done
