name: Paired Xiaomi diagnostic APKs
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/profile-apks.yml']
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build paired debug-only installs; same signer and application ID
        run: |
          chmod +x gradlew
          mkdir -p phone-test
          for mode in false true; do
            ./gradlew :app:assembleDebug -PprofileInstall=true -PcropFirst=false -PfastFrame=$mode
            cp app/build/outputs/apk/debug/app-debug.apk "phone-test/fastFrame-$mode.apk"
          done
          cd phone-test && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phone-ab-debug-only
          path: phone-test/
          retention-days: 7
