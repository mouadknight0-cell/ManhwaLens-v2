name: Build isolated Phase 3B instrument
on:
  push:
    paths: ['tools/phase3b/**', '.github/workflows/phase3b.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash tools/phase3b/build.sh "$RUNNER_TEMP/apks"
